server {
    # Unprivileged port: the container runs as UID 101 and cannot bind :80.
    listen 8080;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # For prometheus metrics if NGINX exporter is used, though usually handled differently.
    location /metrics {
        stub_status;
    }
}
